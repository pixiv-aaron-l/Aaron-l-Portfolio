<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=1200">

<title>{{ALBUM_TITLE}}</title>

<link rel="stylesheet" href="../style.css">

<!-- Every link in this template starts with "../" -- album pages
     live one folder down, at website/albums/<folder>.html, so
     everything needs to step back up to the site root first.
     index.html/arts.html/posts.html don't need this since they
     already live at the root. -->

</head>


<body>


<header>


<a class="site-title" href="../index.html">

{{SITE_NAME}}

</a>



<nav>

<a href="../index.html">ABOUT ME</a>
<a href="../arts.html" class="active">ARTS</a>
<a href="../posts.html">POSTS</a>

</nav>

{{SINCE_TEXT}}


</header>





<main>


<section class="album-header">


<h1>

{{ALBUM_TITLE}}

</h1>



<div class="album-meta">


{{ALBUM_DATE}} • {{ARTWORK_COUNT}} artworks


</div>




<p class="album-description">

{{ALBUM_DESCRIPTION}}

</p>



</section>






<section class="artwork-grid">


{{ARTWORK_GRID}}


</section>




</main>





<footer>

Last updated: {{LAST_UPDATED}}

</footer>


</body>

</html>
